---
- name: Wait for {{ deployment_type }}restore to complete
  kubernetes.core.k8s_info:
    api_version: "{{ api_version }}"
    kind: "{{ deployment_type }}restore"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: restore_status_check
  until:
    # yamllint disable-line rule:line-length
    - (restore_status_check.resources | length == 0) or (restore_status_check.resources | selectattr('spec.deployment_name', 'equalto', ansible_operator_meta.name) | map(attribute='status') | selectattr('restoreComplete', 'defined') | map(attribute='restoreComplete') | list | length > 0)
  delay: 10
  retries: 8640
  ignore_errors: yes
  changed_when: false

- name: Configure public_base_url
  ansible.builtin.set_fact:
    event_stream_base_url: "{{ public_base_url.rstrip('/') }}/{{ event_stream_prefix_path.strip('/') }}"
    event_stream_mtls_base_url: "{{ public_base_url.rstrip('/') }}/{{ event_stream_mtls_prefix_path }}"
  when: public_base_url | default('') | length > 0

- name: Apply ConfigMap resources
  k8s:
    apply: yes
    definition: "{{ lookup('template', 'eda.configmap.yaml.j2') }}"
    wait: yes

- name: Set gateway and controller hostnames for NO_PROXY exclusion
  ansible.builtin.set_fact:
    _gateway_hostname: >-
      {{ extra_settings | default([]) | selectattr('setting', 'equalto', 'EDA_ANSIBLE_BASE_JWT_KEY')
         | map(attribute='value') | select | list | first | default('')
         | urlsplit('hostname') }}
    _controller_hostname: "{{ automation_server_url | default('') | urlsplit('hostname') }}"

- name: Apply proxy environment ConfigMap
  k8s:
    apply: yes
    definition: "{{ lookup('template', 'eda-proxy-env.configmap.yaml.j2') }}"
    state: "{{ 'present' if (http_proxy or https_proxy or no_proxy) else 'absent' }}"

- name: Apply Redirect Page Configmap
  k8s:
    apply: yes
    definition: "{{ lookup('template', 'redirect-page.configmap.html.j2') }}"
    wait: yes
  when: public_base_url is defined

- name: Read activation worker Deployment before autoscaling handoff
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-activation-worker"
    namespace: "{{ ansible_operator_meta.namespace }}"
    hidden_fields: []
  register: activation_worker_deployment_before_autoscaling
  when: combined_activation_worker.autoscaling.enabled | bool

- name: Mark a new activation worker Deployment for minimum-replica bootstrap
  ansible.builtin.set_fact:
    activation_worker_bootstrap: >-
      {{ activation_worker_deployment_before_autoscaling.resources | length == 0
         or activation_worker_deployment_before_autoscaling.resources[0].spec.replicas | default(1) | int == 0 }}
  when: combined_activation_worker.autoscaling.enabled | bool

- name: Read activation worker apply bookkeeping before ownership handoff
  ansible.builtin.set_fact:
    activation_worker_last_applied: >-
      {{ activation_worker_deployment_before_autoscaling.resources[0].metadata.annotations[
         'kubectl.kubernetes.io/last-applied-configuration'] | from_json }}
  when:
    - combined_activation_worker.autoscaling.enabled | bool
    - activation_worker_deployment_before_autoscaling.resources | length > 0
    - >-
      'kubectl.kubernetes.io/last-applied-configuration' in
      activation_worker_deployment_before_autoscaling.resources[0].metadata.annotations | default({})

- name: Remove replicas from activation worker apply bookkeeping during HPA handoff
  ansible.builtin.set_fact:
    activation_worker_last_applied_without_replicas: >-
      {{ activation_worker_last_applied | combine({
         'spec': (activation_worker_last_applied.spec | default({}) | dict2items
                  | rejectattr('key', 'equalto', 'replicas') | list | items2dict)
         }, recursive=False) }}
  when:
    - activation_worker_last_applied is defined
    - activation_worker_last_applied.spec.replicas is defined

- name: Release activation worker replicas from the previous apply definition
  kubernetes.core.k8s_json_patch:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-activation-worker"
    namespace: "{{ ansible_operator_meta.namespace }}"
    patch:
      - op: test
        path: /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        value: >-
          {{ activation_worker_deployment_before_autoscaling.resources[0].metadata.annotations[
             'kubectl.kubernetes.io/last-applied-configuration'] }}
      - op: replace
        path: /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        value: "{{ activation_worker_last_applied_without_replicas | to_json }}"
  when: activation_worker_last_applied_without_replicas is defined

- name: Remove activation worker HPA before restoring fixed replicas
  ansible.builtin.include_tasks: remove_activation_worker_hpa.yml
  when: not (combined_activation_worker.autoscaling.enabled | bool)

- name: Apply Backend deployment resources
  k8s:
    apply: yes
    definition: "{{ lookup('template', item + '.yaml.j2') }}"
    wait: no
  loop:
    - 'eda-api.configmap'
    - 'eda-api.service'
    - 'eda-api.deployment'
    - 'eda-default-worker.deployment'
    - 'eda-activation-worker.deployment'
    - 'eda-event-stream.configmap'
    - 'eda-event-stream.service'
    - 'eda-event-stream.deployment'

- name: Apply activation worker HPA
  kubernetes.core.k8s:
    apply: yes
    definition: "{{ lookup('template', 'eda-activation-worker.hpa.yaml.j2') }}"
    wait: no
  when: combined_activation_worker.autoscaling.enabled | bool

- name: Apply event-stream ingress resources
  k8s:
    apply: yes
    definition: "{{ lookup('template', item + '.yaml.j2') }}"
    wait: no
  loop:
    - 'eda-event-stream.ingress'
  when:
    - (service_type | lower) == 'route' or ((service_type | lower) == 'ingress' and ui_disabled)
  # Always runs if service_type: Route
  # If service_type: Ingress, only run if UI is disabled
  # If UI is enabled, the event-stream ingress is handled by the UI ingress via multiple pathes

- name: Apply UI deployment resources if UI is enabled
  k8s:
    apply: yes
    state: present
    definition: "{{ lookup('template', item + '.yaml.j2') }}"
    wait: no
  loop:
    - 'eda-ui.service'
    - 'eda-ui.deployment'
    - 'eda-ui.ingress'
  when: not ui_disabled

- name: Read UI deployment placement
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-ui"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: _ui_deployment
  when: not ui_disabled

- name: Reconcile UI deployment placement
  kubernetes.core.k8s_json_patch:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-ui"
    namespace: "{{ ansible_operator_meta.namespace }}"
    patch:
      - op: add
        path: /spec/template/spec/nodeSelector
        value: "{{ combined_ui.node_selector }}"
      - op: add
        path: /spec/template/spec/tolerations
        value: "{{ combined_ui.tolerations }}"
      - op: add
        path: /spec/template/spec/affinity
        value: "{{ combined_ui.affinity }}"
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value: "{{ combined_ui.topology_spread_constraints | default([]) }}"
  when:
    - not ui_disabled
    - _ui_deployment.resources | length > 0
    - >-
      (_ui_deployment.resources[0].spec.template.spec.nodeSelector | default({}, true)) != combined_ui.node_selector
      or (_ui_deployment.resources[0].spec.template.spec.tolerations | default([], true)) != combined_ui.tolerations
      or (_ui_deployment.resources[0].spec.template.spec.affinity | default({}, true)) != combined_ui.affinity
      or (_ui_deployment.resources[0].spec.template.spec.topologySpreadConstraints | default([], true)) != (combined_ui.topology_spread_constraints | default([]))

- name: Remove UI deployment resources if UI is disabled
  k8s:
    state: absent
    definition: "{{ lookup('template', item + '.yaml.j2') }}"
    wait: no
  loop:
    - 'eda-ui.service'
    - 'eda-ui.deployment'
    - 'eda-ui.ingress'
  when: ui_disabled

- name: Apply API Route or Ingress if UI is disabled
  k8s:
    state: "{{ 'present' if ui_disabled else 'absent' }}"
    definition: "{{ lookup('template', item + '.yaml.j2') }}"
    wait: no
  loop:
    - 'eda-api.ingress'

- name: Remove legacy EDA worker deployment
  k8s:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-worker"
    namespace: "{{ ansible_operator_meta.namespace }}"
    state: absent

- name: Remove legacy EDA scheduler deployment
  k8s:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-scheduler"
    namespace: "{{ ansible_operator_meta.namespace }}"
    state: absent

- name: Remove legacy Redis deployment (upgrade cleanup)
  k8s:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-redis"
    namespace: "{{ ansible_operator_meta.namespace }}"
    state: absent

- name: Remove legacy Redis service (upgrade cleanup)
  k8s:
    api_version: v1
    kind: Service
    name: "{{ ansible_operator_meta.name }}-redis-svc"
    namespace: "{{ ansible_operator_meta.namespace }}"
    state: absent

- name: Remove legacy Redis secret (upgrade cleanup)
  k8s:
    api_version: v1
    kind: Secret
    name: "{{ ansible_operator_meta.name }}-redis-configuration"
    namespace: "{{ ansible_operator_meta.namespace }}"
    state: absent

- name: Check for API Pod
  k8s_info:
    kind: Pod
    api_version: v1
    namespace: "{{ ansible_operator_meta.namespace }}"
    label_selectors:
      - "app.kubernetes.io/name={{ ansible_operator_meta.name }}"
      - "app.kubernetes.io/managed-by={{ deployment_type }}-operator"
      - "app.kubernetes.io/component={{ deployment_type }}-api"
    field_selectors:
      - status.phase=Running
  register: eda_api_pod
  until:
    - "eda_api_pod['resources'] | length"
    - "eda_api_pod['resources'][0]['status']['phase'] == 'Running'"
    - "eda_api_pod['resources'][0]['status']['containerStatuses'][0]['ready'] == true"
    - "eda_api_pod['resources'][0]['status']['containerStatuses'][1]['ready'] == true"
  retries: 60
  delay: 5

- name: Set the resource pod name as a variable.
  set_fact:
    eda_api_pod_name: "{{ eda_api_pod['resources'][0]['metadata']['name'] | default('') }}"
