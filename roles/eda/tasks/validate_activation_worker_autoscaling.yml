---
- name: Validate activation worker autoscaling settings
  ansible.builtin.assert:
    that:
      - combined_activation_worker.autoscaling.min_replicas is integer
      - combined_activation_worker.autoscaling.min_replicas >= 1
      - combined_activation_worker.autoscaling.max_replicas is integer
      - combined_activation_worker.autoscaling.max_replicas >= 1
      - combined_activation_worker.autoscaling.max_replicas >= combined_activation_worker.autoscaling.min_replicas
      - combined_activation_worker.autoscaling.target_cpu_utilization_percentage is integer
      - combined_activation_worker.autoscaling.target_cpu_utilization_percentage >= 1
      - combined_activation_worker.resource_requirements.requests.cpu is defined
      - >-
        (combined_activation_worker.resource_requirements | default({})).get('requests', {}).get('cpu', '')
        | string is match('^(?:[1-9][0-9]*(?:\.[0-9]*)?|0?\.[0-9]*[1-9][0-9]*)(?:m|u|n|[eE][+-]?[0-9]+)?$')
    fail_msg: >-
      activation_worker.autoscaling requires integer min_replicas >= 1,
      max_replicas >= min_replicas, target_cpu_utilization_percentage >= 1,
      and a positive activation-worker CPU request (for example 25m or 0.5).
