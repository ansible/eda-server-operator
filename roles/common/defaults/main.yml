---
# defaults file for EDA

deployment_type: eda
kind: 'EDA'
api_version: '{{ deployment_type }}.ansible.com/v1alpha1'

# Labels defined on the resource, which should be propagated to child resources
additional_labels: []

# Add annotations to the service account. Specify as literal block. E.g.:
# service_account_annotations: |
#   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<IAM_ROLE_NAME>
service_account_annotations: ''

# This should be true if using the operator loop.
# Set to false to run a role locally for testing.
set_self_labels: true

# Used to determine some cluster specific logic
is_k8s: false
is_openshift: false

# kubernetes.core client-side apply writes last-applied-configuration under
# OpenAPI-Generator. Skip strip when any other manager owns that annotation
# (kubectl/oc apply, custom --field-manager, Argo/Flux/Helm). A later
# kubectl label does not own the key, so leftovers still get cleaned.
_leftover_csa_manager_regex: '^(openapi-generator)'

