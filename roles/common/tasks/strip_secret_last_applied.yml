---
# AAP-93432: strip cleartext credentials leaked into the
# kubectl.kubernetes.io/last-applied-configuration annotation.
#
# Operator versions before this one created Secrets with client-side apply,
# which mirrors `kubectl apply` and persists the full submitted manifest —
# stringData included — in that annotation. Read access to Secret *metadata*
# was therefore enough to recover secret data.
#
# Secrets written by this version use server-side apply and never produce the
# annotation, so this task exists purely to remediate deployments upgraded
# from an affected version. It is a no-op once every managed Secret is clean.
#
# Ownership: only this reconcile's generated names, never a custom CR-referenced
# name, never gateway postgres (managed_by_aap=true). Backup/restore copies
# generated names into spec (admin_password_secret, db_fields_encryption_secret,
# database.database_secret); those leftovers must still be stripped.
# GitOps `oc apply` of a generated name is skipped when a manager other
# than OpenAPI-Generator owns last-applied-configuration, or when Argo /
# Flux / Helm tracking annotations or labels are present. A kubectl label
# on a leftover does not own that annotation, so it is still stripped.
# Do not require app.kubernetes.io labels: postgres.secret.yaml.j2 is unlabeled,
# so a label filter would leave legacy postgres leftovers in place.
# JSON patch remove is used instead of strategic-merge null so the
# annotation is actually deleted.
- name: Reset leftover strip list
  ansible.builtin.set_fact:
    _secrets_to_strip: []

- name: Build user-supplied secret name list
  ansible.builtin.set_fact:
    _user_supplied_secret_names: "{{ _user_supplied_secret_candidates | union(image_pull_secrets | default([], true) | list) | reject('equalto', '') | list }}"
  vars:
    _user_supplied_secret_candidates:
      - "{{ admin_password_secret | default('') }}"
      - "{{ db_fields_encryption_secret | default('') }}"
      - "{{ (database | default({}, true)).database_secret | default('') }}"
      - "{{ (event_stream | default({}, true)).database_secret | default('') }}"
      - "{{ (event_persistence | default({}, true)).database_secret | default('') }}"
      - "{{ bundle_cacert_secret | default('') }}"
      - "{{ route_tls_secret | default('') }}"
      - "{{ ingress_tls_secret | default('') }}"
      - "{{ old_postgres_configuration_secret | default('') }}"

- name: Operator-generated secret names this reconcile may own
  ansible.builtin.set_fact:
    _operator_generated_secret_names:
      - "{{ ansible_operator_meta.name }}-admin-password"
      - "{{ ansible_operator_meta.name }}-db-fields-encryption-secret"
      - "{{ ansible_operator_meta.name }}-postgres-configuration"
      - "{{ ansible_operator_meta.name }}-event-stream-postgres-configuration"
      - "{{ ansible_operator_meta.name }}-event-persistence-postgres-configuration"

- name: List secrets in the CR namespace
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: _ns_secrets
  no_log: "{{ no_log }}"

- name: Select operator leftovers whose last-applied annotation is safe to strip
  ansible.builtin.set_fact:
    _secrets_to_strip: "{{ _secrets_to_strip + [item.metadata.name] }}"
  loop: "{{ _ns_secrets.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  vars:
    _ann: "{{ item.metadata.annotations | default({}, true) }}"
    _labels: "{{ item.metadata.labels | default({}, true) }}"
    _ann_keys: "{{ _ann.keys() | list }}"
    _label_keys: "{{ _labels.keys() | list }}"
    _gitops_last_applied: >-
      {%- set ns = namespace(owners=[]) -%}
      {%- for mf in item.metadata.managedFields | default([], true) -%}
      {%- set fv = mf.fieldsV1 | default({}, true) -%}
      {%- set annf = (fv['f:metadata'] | default({}, true))['f:annotations'] | default({}, true) -%}
      {%- if annf['f:kubectl.kubernetes.io/last-applied-configuration'] is defined -%}
      {%- set ns.owners = ns.owners + [mf.manager | default('') | lower] -%}
      {%- endif -%}
      {%- endfor -%}{{ ns.owners | reject('match', _leftover_csa_manager_regex) | list | length > 0 }}
    _gitops_ann: "{{ _ann_keys | select('match', '^(argocd\\.argoproj\\.io/|kustomize\\.toolkit\\.fluxcd\\.io/|helm\\.toolkit\\.fluxcd\\.io/|meta\\.helm\\.sh/|helm\\.sh/)') | list | length > 0 }}"
    _gitops_lbl: "{{ _label_keys | select('match', '^(argocd\\.argoproj\\.io/|kustomize\\.toolkit\\.fluxcd\\.io/|helm\\.toolkit\\.fluxcd\\.io/)') | list | length > 0 }}"
    _custom_cr_names: "{{ _user_supplied_secret_names | difference(_operator_generated_secret_names) }}"
  when:
    - _ann['kubectl.kubernetes.io/last-applied-configuration'] is defined
    - item.metadata.name in _operator_generated_secret_names
    - item.metadata.name not in _custom_cr_names
    - not (_gitops_last_applied | bool)
    - not (_gitops_ann | bool)
    - not (_gitops_lbl | bool)
    - >
      (item.data | default({}, true)).managed_by_aap is not defined
      or ((item.data | default({}, true)).managed_by_aap | b64decode) != 'true'
  no_log: "{{ no_log }}"

- name: Remove kubectl.kubernetes.io/last-applied-configuration annotation
  kubernetes.core.k8s_json_patch:
    api_version: v1
    kind: Secret
    namespace: "{{ ansible_operator_meta.namespace }}"
    name: "{{ item }}"
    patch:
      - op: remove
        path: /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
  loop: "{{ _secrets_to_strip }}"
  loop_control:
    label: "{{ item }}"
  no_log: "{{ no_log }}"
