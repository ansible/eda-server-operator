---
- name: Assert guard test variables are defined
  ansible.builtin.assert:
    that:
      - namespace is defined and namespace | length > 0
      - guard_test_event_stream_secret is defined and guard_test_event_stream_secret | length > 0
      - guard_test_sentinel is defined and guard_test_sentinel | length > 0
      - guard_test_event_persistence_generated_suffix is defined
      - guard_test_event_stream_generated_suffix is defined
    fail_msg: "Required guard test variables are not defined (check molecule.yml group_vars)"

- name: Set EDA resource name from sample CR
  ansible.builtin.set_fact:
    eda_cr_name: >-
      {{ lookup('file', samples_dir + '/eda_v1alpha1_eda.yaml')
         | from_yaml | json_query('metadata.name') }}

- name: Assert EDA resource name resolved from the sample CR
  ansible.builtin.assert:
    that:
      - eda_cr_name is defined
      - eda_cr_name | length > 0
    fail_msg: "Could not resolve metadata.name from the sample EDA CR"

- name: Compute expected secret names for both guard branches
  ansible.builtin.set_fact:
    expected_event_stream_secret: '{{ guard_test_event_stream_secret }}'
    expected_event_persistence_secret: '{{ eda_cr_name }}-{{ guard_test_event_persistence_generated_suffix }}'
    default_event_stream_secret: '{{ eda_cr_name }}-{{ guard_test_event_stream_generated_suffix }}'

- name: Read the EDA CR status
  kubernetes.core.k8s_info:
    api_version: eda.ansible.com/v1alpha1
    kind: EDA
    namespace: '{{ namespace }}'
    name: '{{ eda_cr_name }}'
  register: eda_cr
  until:
    - eda_cr.resources | length > 0
    - eda_cr.resources[0].status.eventStreamDatabaseConfigurationSecret | default('') | length > 0
    - eda_cr.resources[0].status.eventPersistenceDatabaseConfigurationSecret | default('') | length > 0
  retries: 20
  delay: 15

- name: Assert event stream status reports the CR-referenced (adopted) secret
  ansible.builtin.assert:
    that:
      - eda_cr.resources[0].status.eventStreamDatabaseConfigurationSecret == expected_event_stream_secret
    fail_msg: >-
      Event stream guard regressed: status reports
      '{{ eda_cr.resources[0].status.eventStreamDatabaseConfigurationSecret }}'
      instead of the CR-referenced secret '{{ expected_event_stream_secret }}'.

- name: Read the CR-referenced event stream secret
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ namespace }}'
    name: '{{ expected_event_stream_secret }}'
  register: es_secret
  no_log: '{{ guard_test_no_log | default(true) }}'

- name: Assert the referenced event stream secret still holds the original sentinel password
  ansible.builtin.assert:
    that:
      - es_secret.resources | length == 1
      - es_secret.resources[0].data.password | b64decode == guard_test_sentinel
    fail_msg: "The referenced event stream secret was overwritten by the operator (guard regressed)"
  no_log: '{{ guard_test_no_log | default(true) }}'

- name: Read any default-named event stream secret
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ namespace }}'
    name: '{{ default_event_stream_secret }}'
  register: es_default_secret
  no_log: '{{ guard_test_no_log | default(true) }}'

- name: Assert no auto-generated default-named event stream secret exists
  ansible.builtin.assert:
    that:
      - es_default_secret.resources | length == 0
    fail_msg: >-
      Operator generated a default-named secret '{{ default_event_stream_secret }}'
      instead of adopting the CR-referenced one. Event stream guard regressed.

- name: Assert event persistence status reports the auto-generated default-named secret
  ansible.builtin.assert:
    that:
      - eda_cr.resources[0].status.eventPersistenceDatabaseConfigurationSecret == expected_event_persistence_secret
    fail_msg: >-
      Event persistence guard regressed: status reports
      '{{ eda_cr.resources[0].status.eventPersistenceDatabaseConfigurationSecret }}'
      instead of the expected auto-generated secret '{{ expected_event_persistence_secret }}'.

- name: Read the auto-generated event persistence secret
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ namespace }}'
    name: '{{ expected_event_persistence_secret }}'
  register: ep_secret
  no_log: '{{ guard_test_no_log | default(true) }}'

- name: Assert the auto-generated event persistence secret exists and was operator-managed
  vars:
    expected_managed_by: "{{ (deployment_type | default('eda')) + '-operator' }}"
  ansible.builtin.assert:
    that:
      - ep_secret.resources | length == 1
      - ep_secret.resources[0].metadata.labels['app.kubernetes.io/managed-by'] == expected_managed_by
      - ep_secret.resources[0].data.password | b64decode | length > 0
      - ep_secret.resources[0].data.password | b64decode != guard_test_sentinel
    fail_msg: "Auto-generated event persistence secret is missing, unmanaged, or has no generated password"
  no_log: '{{ guard_test_no_log | default(true) }}'
