---
# AAP-93432: operator-managed Secrets must not persist
# kubectl.kubernetes.io/last-applied-configuration (client-side apply leak).
# Fixture Secrets (prepare.yml event-stream postgres, image pull secrets)
# are out of scope. Sample CR sets event_stream.database_secret to an
# external name, so the generated event-stream Secret is not created.
- block:
    - name: Set EDA resource name from sample CR
      ansible.builtin.set_fact:
        eda_cr_name: >-
          {{ lookup('file', samples_dir + '/eda_v1alpha1_eda.yaml')
             | from_yaml | json_query('metadata.name') }}

    - name: Operator-managed secret names created by the sample CR
      ansible.builtin.set_fact:
        _operator_secret_names:
          - "{{ eda_cr_name }}-admin-password"
          - "{{ eda_cr_name }}-db-fields-encryption-secret"
          - "{{ eda_cr_name }}-postgres-configuration"
          - "{{ eda_cr_name }}-event-persistence-postgres-configuration"
        _postgres_secret_name: "{{ eda_cr_name }}-postgres-configuration"
        _admin_secret_name: "{{ eda_cr_name }}-admin-password"
        _dbenc_secret_name: "{{ eda_cr_name }}-db-fields-encryption-secret"
        _gitops_secret_name: "{{ eda_cr_name }}-event-stream-postgres-configuration"

    - name: Get operator-managed Secret
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ namespace }}"
      register: _operator_secrets
      loop: "{{ _operator_secret_names }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert operator-managed secrets exist without last-applied-configuration
      ansible.builtin.assert:
        that:
          - item.resources | default([]) | length == 1
          - >-
            (item.resources[0].metadata.annotations | default({}))
            ['kubectl.kubernetes.io/last-applied-configuration'] is not defined
        fail_msg: >-
          Secret {{ item.item }} is missing or still has
          kubectl.kubernetes.io/last-applied-configuration
      loop: "{{ _operator_secrets.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Snapshot postgres Secret before upgrade-cleanup simulation
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ _postgres_secret_name }}"
        namespace: "{{ namespace }}"
      register: _postgres_before

    - name: Snapshot admin-password Secret before upgrade-cleanup simulation
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ _admin_secret_name }}"
        namespace: "{{ namespace }}"
      register: _admin_before

    - name: Seed last-applied-configuration on unlabeled generated postgres Secret
      kubernetes.core.k8s:
        state: patched
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ _postgres_secret_name }}"
            namespace: "{{ namespace }}"
            annotations:
              kubectl.kubernetes.io/last-applied-configuration: >-
                {"kind":"Secret","stringData":{"password":"leaked-from-upgrade"}}

    - name: Seed last-applied-configuration on generated admin-password Secret
      kubernetes.core.k8s:
        state: patched
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ _admin_secret_name }}"
            namespace: "{{ namespace }}"
            annotations:
              kubectl.kubernetes.io/last-applied-configuration: >-
                {"kind":"Secret","stringData":{"password":"leaked-from-upgrade"}}

    - name: Stage GitOps Secret manifest
      ansible.builtin.tempfile:
        suffix: .json
      register: _gitops_manifest

    - name: Write GitOps Secret manifest
      ansible.builtin.copy:
        dest: "{{ _gitops_manifest.path }}"
        content: "{{ _gitops_secret | to_json }}"
      vars:
        _gitops_secret:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ _gitops_secret_name }}"
            namespace: "{{ namespace }}"
          stringData:
            username: eda_event_stream
            password: gitops-keep-last-applied
            database: eda
            port: "5432"
            host: gitops.example.invalid
            sslmode: prefer
            type: unmanaged
      no_log: true

    - name: Apply GitOps Secret with kubectl field manager
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ _gitops_manifest.path }}"
      changed_when: true

    - name: Remove GitOps Secret manifest
      ansible.builtin.file:
        path: "{{ _gitops_manifest.path }}"
        state: absent

    - name: Snapshot db-fields-encryption Secret before managed_by_aap simulation
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ _dbenc_secret_name }}"
        namespace: "{{ namespace }}"
      register: _dbenc_before

    - name: Seed last-applied-configuration and managed_by_aap on db-fields-encryption Secret
      kubernetes.core.k8s:
        state: patched
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ _dbenc_secret_name }}"
            namespace: "{{ namespace }}"
            annotations:
              kubectl.kubernetes.io/last-applied-configuration: '{"kind":"Secret","stringData":{"secret_key":"leaked"}}'
          stringData:
            managed_by_aap: "true"

    # ansible-operator reconciles on spec generation (annotation-only patches
    # may be ignored). Backup/restore copies generated names into spec; json
    # patch keeps other database fields. Strip runs at the start of common.
    - name: Trigger EDA reconcile with restore-like generated Secret names in spec
      kubernetes.core.k8s_json_patch:
        api_version: eda.ansible.com/v1alpha1
        kind: EDA
        name: "{{ eda_cr_name }}"
        namespace: "{{ namespace }}"
        patch:
          - op: add
            path: /spec/database/database_secret
            value: "{{ _postgres_secret_name }}"
          - op: add
            path: /spec/admin_password_secret
            value: "{{ _admin_secret_name }}"

    - name: Wait until leftover last-applied-configuration is stripped from postgres
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ _postgres_secret_name }}"
        namespace: "{{ namespace }}"
      register: _postgres_after
      until:
        - _postgres_after.resources | default([]) | length == 1
        - >-
          (_postgres_after.resources[0].metadata.annotations | default({}))
          ['kubectl.kubernetes.io/last-applied-configuration'] is not defined
      retries: 30
      delay: 10

    - name: Wait until leftover last-applied-configuration is stripped from admin-password
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ _admin_secret_name }}"
        namespace: "{{ namespace }}"
      register: _admin_after
      until:
        - _admin_after.resources | default([]) | length == 1
        - >-
          (_admin_after.resources[0].metadata.annotations | default({}))
          ['kubectl.kubernetes.io/last-applied-configuration'] is not defined
      retries: 30
      delay: 10

    - name: Assert upgrade cleanup left postgres and admin Secret data unchanged
      ansible.builtin.assert:
        that:
          - _postgres_after.resources[0].data.password == _postgres_before.resources[0].data.password
          - _admin_after.resources[0].data.password == _admin_before.resources[0].data.password
        fail_msg: Upgrade cleanup changed generated Secret data

    - name: Get GitOps and managed_by_aap Secrets after reconcile
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ namespace }}"
      register: _protected_secrets
      loop:
        - "{{ _gitops_secret_name }}"
        - "{{ _dbenc_secret_name }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert GitOps and gateway Secrets kept last-applied-configuration
      ansible.builtin.assert:
        that:
          - item.resources | default([]) | length == 1
          - >-
            (item.resources[0].metadata.annotations | default({}))
            ['kubectl.kubernetes.io/last-applied-configuration'] is defined
        fail_msg: >-
          Protected Secret {{ item.item }} lost
          kubectl.kubernetes.io/last-applied-configuration
      loop: "{{ _protected_secrets.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert managed_by_aap seed left encryption key unchanged
      ansible.builtin.assert:
        that:
          - item.resources[0].data.secret_key == _dbenc_before.resources[0].data.secret_key
        fail_msg: managed_by_aap seed changed db-fields-encryption-secret data
      loop: "{{ _protected_secrets.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.item == _dbenc_secret_name
