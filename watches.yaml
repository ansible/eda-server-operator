---
- version: v1alpha1
  group: eda.ansible.com
  kind: EDA
  playbook: playbooks/eda.yml
  snakeCaseParameters: False
  markUnsafe: true
  finalizer:
    name: eda.ansible.com/finalizer
    playbook: playbooks/eda_finalizer.yml

- version: v1alpha1
  group: eda.ansible.com
  kind: EDABackup
  role: backup
  snakeCaseParameters: False
  markUnsafe: true
  finalizer:
    name: eda.ansible.com/finalizer
    role: backup
    vars:
      finalizer_run: true

- version: v1alpha1
  group: eda.ansible.com
  kind: EDARestore
  role: restore
  snakeCaseParameters: False
  markUnsafe: true

#+kubebuilder:scaffold:watch
